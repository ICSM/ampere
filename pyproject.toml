[build-system]
requires = ["setuptools>=77.0.3", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "ampere"
# version = "0.1.2"
dynamic = ["version"]
# SPDX expression (PEP 639); the shipped licence text is GPLv3, and
# ampere/__init__.py declares "version 3 ... or (at your option) any later
# version".
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
description = ""
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.12"  # raised from 3.11 on 2026-09-22: arviz 1.x needs 3.12 (see "arviz" below)
dependencies = [
    "numpy",
    "astropy>=4.0.0",
    "scipy",
    "matplotlib",
    "spectres",
    "tqdm",
    "pyphot",  # W0.9: forward-migrated onto pyphot >= 2's unit-adapter API via ampere/utils/pyphot_compat.py (pyphot < 2 still works through the same compat layer)
    # pyphot 2.1.1 imports `requests` at module level without declaring it, so
    # a bare `pip install ampere` could not `import pyphot` (the minimal-install
    # CI job caught it; W2.1's out-of-scope finding). Declared here on pyphot's
    # behalf (ruled by Peter 2026-09-07) until pyphot fixes its own metadata --
    # ampere itself makes no HTTP requests. If ampere ever needs an HTTP client
    # of its own, httpx, aiohttp or niquests would be better choices than
    # requests; revisit this line rather than building on it.
    "requests",
    "emcee",
    "dynesty",
    "corner",
    # W2.2: promoted out of the `arviz` extra, per Peter's 2026-09-03 ruling on
    # `results.md` §15 R1 -- "arviz joins the base install with Phase 2's engine
    # drivers, promoted together with a netCDF engine, when a user can first
    # emit a run". That moment is this item: `ampere.inference` makes every run
    # emit an ArviZ DataTree through `ampere.results`, so a base install that
    # could not build one would be a base install that cannot sample.
    # h5netcdf rather than netCDF4 because arviz requires neither and one is
    # needed to *write* the run: `pip install "ampere[arviz]"` used to install
    # something that could build a run and not save it (`results.md` §15 R1
    # names that gap). h5netcdf is the lighter of the two -- pure Python over
    # h5py -- and is the engine `ampere.results.emission` already names in its
    # missing-engine remedy.
    # 2026-09-22: ampere.results is written against arviz 1.x (xarray DataTree
    # results). arviz 1.x requires Python >= 3.12, and on 3.11 the resolver
    # silently fell back to arviz 0.23 (InferenceData), which the first CI run
    # on the v2 branch caught in tests/core. The floor above follows from this.
    "arviz>=1",
    "h5netcdf",
    "celerite2",  # W2.3: the O(N) quasiseparable GP solve. architecture.md §2/§3 make celerite2's numpy interface a base dependency, never an extra -- a base install that still has the O(N^3) problem defeats the reference backend's purpose. Imported lazily, only when QuasisepGP is actually used.
]

[[project.authors]]
name = "Peter Scicluna"
email = "peter.scicluna@eso.org"

[[project.authors]]
name = "Francisca Kemper"

[[project.authors]]
name = "Sundar Srinivasan"

[[project.authors]]
name = "Jonathan Marshall"

[[project.authors]]
name = "Oscar Morata"

[[project.authors]]
name = "Alfonso Trejo"

[[project.authors]]
name = "Sascha Zeegers"

[[project.authors]]
name = "Lapo Fanciullo"

[[project.authors]]
name = "Thavisha Dharmawardena"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/icsm/ampere"
"Bug Tracker" = "https://github.com/icsm/ampere/issues"

[project.optional-dependencies]
# Backend extras are placeholders for the Phase 2 backend split; they will
# grow pinned/qualified requirements as the backends land.
# W2.4: the torch backend track. `torch` itself for the lowering/model path;
# `pyro-ppl` for the NUTS driver in `ampere.inference` (pyro's NUTS/HMC is the
# gradient-based sampler the differentiable backends exist to feed -- see
# WORK_ITEMS.md W2.4 and DEVELOPMENT_PLAN.md §5). Deliberately nothing
# speculative beyond those two: the quasiseparable GP library (GPyTorch vs
# celerite2's torch interface) is chosen in slice 2, against measurements, and
# only then does its requirement land here. CPU wheels are fine; no
# CUDA-specific pins.
torch = ["torch", "pyro-ppl"]
# W2.5 (the jax backend track): jax itself, plus the two libraries
# `docs/design/lowering.md` names for this backend. numpyro supplies the
# distribution objects and the `biject_to` bijections the §3/§4 lowering
# tables are written against (and, in `ampere.inference`, the NUTS kernel);
# equinox supplies `eqx.partition`/`eqx.combine`, the filter-spec mechanism
# ruled in DEVELOPMENT_PLAN.md §2 ("jax non-trainable mechanism") as the way
# fixed parameters and buffers stay ordinary array leaves rather than static
# fields. **Still exactly three, after slice 2 chose the quasiseparable GP
# library**: the choice was celerite2.jax over tinygp (DEVELOPMENT_PLAN.md §2's
# "jax quasiseparable GP library" row carries the measured table), and
# celerite2 has been a *base* dependency since W2.3 -- so the O(N) GP solve
# costs this extra nothing at all. celerite2.jax is nonetheless imported
# **lazily**, only after `require_x64` has passed, because it flips
# `jax_enable_x64` as an import side effect and `lowering.md` §10.2(a) forbids
# ampere from letting that happen on a user's behalf. CPU jaxlib is what `jax`
# resolves to on PyPI without a hardware suffix, which is what CI and the
# daily-use machines want.
jax = ["jax", "numpyro", "equinox"]
sbi = ["torch", "sbi"]  # W0.9: forward-migrated -- pin lifted (PyPI's latest release is still 0.27.0, the version this was already tested against; see the W0.9 report)
zeus = ["zeus-mcmc"]
# W5.14: the inference-extensions memo's tier-1 engines, **one extra per
# sampler** -- `inference_extensions_memo.md` §10, ruled by Peter 2026-09-10:
# "every new sampler behind its own extra -- the base install stays quick to
# start with, a user upgrades for a specific problem". So `nautilus` and
# `ultranest` get an extra each even though one module (`ampere/inference/
# _nested.py`) drives both: the shared driver is an implementation economy,
# and the ruling is about what a user has to download.
#
# Both are genuinely light on the dependency side -- nautilus pulls
# scikit-learn and threadpoolctl, ultranest matplotlib and corner, and
# neither pulls torch or jax -- which is what the memo's §5.6 tier table
# means by "no new deps of weight" and what lets them share one small pixi
# environment (`nested`, below) rather than needing a backend one.
nautilus = ["nautilus-sampler"]
ultranest = ["ultranest"]
# W5.14: the blackjax route (MCLMC as a sampler, Pathfinder as an initialiser
# and as an approximation). blackjax itself depends on jax, but ampere's *jax
# backend* -- which is what supplies the differentiable realisation this
# driver consumes -- needs numpyro and equinox too, so the working
# combination is `pip install "ampere[jax,blackjax]"`. Listing only the new
# sampler here keeps one extra to one sampler, as the ruling asks; the
# driver's refusal names the `jax` extra when the backend is missing.
#
# **Declared and locked ahead of its driver, then landed.** W5.14 landed the
# nested pair (`_nested.py`) and handed the blackjax route on to a follow-on
# session; W5.19 landed `ampere/inference/_blackjax.py` -- `BlackjaxEngine`,
# routing MCLMC as a sampler and Pathfinder as both an initialiser and an
# approximation. It is here, with its pixi feature and its place in the
# `jax` environment, because declaring it ahead of the driver was the part
# of the work that cost a lock re-solve; the driver's own module and tests
# needed no further packaging change.
blackjax = ["blackjax"]
# W6.9: the RHMF exploratory trial (`examples/rhmf_trial/`), **a trial's extra,
# not a user feature**: `ampere.diagnostics` has not landed (the maturity gate
# of DEVELOPMENT_PLAN.md §2, row W2.7, is unmet), so nothing under `ampere/`
# imports `robusta_hmf`. The trial was run against the *commit*
# `cf2fcffa10bc` (the upstream `paper` tag), pinned in the pixi feature below.
# The pin is not spelt here because PyPI refuses uploads whose metadata carries
# a direct reference (`robusta-hmf @ git+...`), and this extra must not stop
# the 1.0.0b1 upload; `pip install "ampere[rhmf]"` therefore resolves the
# 0.0.2 release, which the trial was not run against (see `diagnostics.md` §7,
# "Amended W6.9").
rhmf = ["robusta-hmf"]
# NOTE: there is deliberately no `arviz` extra any more -- arviz and a netCDF
# engine are base dependencies as of W2.2 (see [project.dependencies] above).
# The extra is not retained as an empty alias: `pip install "ampere[arviz]"`
# failing loudly with "does not provide the extra 'arviz'" is a better answer
# than one that silently succeeds and teaches the wrong mental model.
# W0.5: replaces the abandoned 'extinction' package (issue #75) for
# ampere.models.extinctionModels.F99Extinction; imported lazily, so it is
# optional rather than a core dependency.
extinction = ["dust_extinction"]
dev = [
    # test + coverage
    "pytest",
    "pytest-cov",
    "coverage",
    # W2.11: the benchmark harness (DEVELOPMENT_PLAN.md §2's "benchmark
    # harness" row records the choice of pytest-benchmark over asv and why).
    # A pytest plugin, so `tests/benchmarks` reuses the same environments,
    # fixtures and skip logic as every other suite, and `--benchmark-json`
    # writes the machine-readable artefact CI uploads.
    "pytest-benchmark",
    # W6.10: the parallelism audit (docs/development.md, "The merged gate");
    # `test-all` and `test-fast` run under `-n 4`.
    "pytest-xdist",
    # lint/format + types
    "ruff",
    "pyrefly",
    # docs (W6.4): the pip half of the documentation build, shared with
    # Read the Docs through the `docs` extra rather than duplicated.
    "ampere[docs]",
]
# W6.4: exactly the pip packages the documentation build needs, so Read the
# Docs (which runs pip, not pixi -- see .readthedocs.yaml) and the pixi `dev`
# environment build the same site. `ipykernel` executes the two v2 notebooks
# at build time; `zeus-mcmc` is what the modified-blackbody notebook's
# ZeusEngine imports; alabaster, the theme, ships with Sphinx. `pandoc` is
# not a pip package: apt on Read the Docs, conda in the pixi `dev` feature.
docs = [
    "sphinx",
    "nbsphinx",
    "nbconvert",
    "ipykernel",
    "ampere[zeus]",
]
# Every feature extra (not dev) composed; self-referential extras are
# supported by pip and setuptools.
all = ["ampere[torch,jax,sbi,zeus,extinction,nautilus,ultranest,blackjax]"]

[tool.setuptools]
include-package-data = false

# Automatic package discovery: future namespaces (ampere.core,
# ampere.backends, ...) are picked up without manual listing.
[tool.setuptools.packages.find]
include = ["ampere*"]

[tool.setuptools.package-data]
ampere = ["ampere_allfilters.hd5"]

[tool.setuptools_scm]

[tool.ruff]
# 100, not ruff's 88 default: wide enough that the pre-existing W0.4/W0.5
# characterisation suite (tests/characterisation/, frozen for this item --
# see WORK_ITEMS.md W0.6 "Constraints") passes lint/format-check without
# editing it, while still being a normal, deliberate line-length choice for
# new code.
line-length = 100
target-version = "py312"

# Lint/format scope policy (W0.6, 2026-09-01): the legacy codebase carries
# ~900 pre-existing ruff findings that are out of scope for this item and
# that AGENTS.md/WORK_ITEMS.md freeze anyway (`ampere/data`, `ampere/models`,
# `ampere/infer`; extended here to `ampere/utils`, `ampere/__init__.py`,
# `ampere/logger.py` and `setup.py`, all of comparable vintage/quality) --
# these are excluded outright rather than per-file-ignored, so the gate is
# meaningful. `docs` (Sphinx conf.py + demo notebooks under docs/source, and
# W0.7's harvested/archived branch snapshots under docs/design -- explicitly
# "does not import" per AGENTS.md) and the root `demo_pyphot.ipynb` are
# excluded for the same reason -- documentation/demo/archival material, not
# package or test source. `examples/examples_paper` is Peter's in-progress
# paper-revision work (AGENTS.md: "leave it alone") and stays excluded on
# that basis alone.
# `examples/` itself was brought under ruff at W5.2: it is shipped, tested
# code (`tests/examples`), not archival material, so it is linted/formatted
# like `tests/` and the new namespaces below.
# `tests/` and the future new namespaces (`ampere/core`, `ampere/backends`,
# `ampere/inference`, `ampere/results`, per AGENTS.md ground rule 8) are
# NOT excluded -- they are linted/formatted strictly. The three remaining
# findings in `tests/characterisation/conftest.py` and the three in
# `tests/test_imports.py` are pre-existing and cannot be fixed here without
# editing frozen test logic; see `[tool.ruff.lint.per-file-ignores]` below.
# W6.0 moved `ampere/data`, `ampere/models`, `ampere/infer`, `ampere/utils`
# and `ampere/logger.py` under one subpackage, `ampere/legacy` -- the five
# entries collapse to the one below -- and rewrote `ampere/__init__.py`
# from scratch, so it drops out of this list and is linted/formatted like
# any other new-namespace file.
extend-exclude = [
    "ampere/legacy",
    "ampere/examples",
    "examples/examples_paper",
    "docs",
    "demo_pyphot.ipynb",
    "setup.py",
]

# include notebooks!
include = ["*.py", "*.pyi", "**/pyproject.toml", "*.ipynb"]

[tool.ruff.lint]
select = ["A",  # prevent using keywords that clobber python builtins
          "B",  # bugbear: security warnings
          "E",  # pycodestyle
          "F",  # pyflakes
          "ISC",  # implicit string concatenation
          "UP",  # alert you when better syntax is available in your python version
          "RUF",  # the ruff developer's own rules
          "W",  # pycodestyle warnings

          ]
ignore = ["UP004", "B007"]  # ["E501", "W503"]

[tool.ruff.lint.per-file-ignores]
# tests/characterisation/ is frozen test logic for this item (W0.6
# Constraints) -- these three Bugbear findings pre-date this branch and
# cannot be fixed by editing the file, only ignored: B008 (np.array(...) in
# a default argument -- LinearModel mirrors the legacy example's
# ASimpleModel signature deliberately), B005 (ampere.__file__.strip(...)
# multi-char strip -- mirrors legacy filter-library loading idiom), B905
# (zip() without strict= in assert_means_within_tolerance).
"tests/characterisation/conftest.py" = ["B005", "B008", "B905"]
# Same freeze does not cover test_imports.py, but this item is config-only
# outside frozen paths too: three `# noqa: F401` comments (W0.5, on
# `import ampere.models` / `.infer` / `.data` inside
# test_top_level_packages_import_cleanly) are flagged RUF100
# (unused-noqa) because ruff's pyflakes only raises F401 once per
# repeatedly-rebound local name (`ampere`) across the four `import
# ampere[.x]` statements -- a ruff quirk, not a reason to touch W0.5's test.
"tests/test_imports.py" = ["RUF100"]
# W5.2 brought examples/ under ruff. Two findings recur across old legacy
# scripts that predate this item and cannot be silenced by editing the
# file without changing what it does (AGENTS.md: examples' behaviour is
# not this item's to change):
# B005 (`ampere.__file__.strip('__init__.py')`, the same multi-character
# `.strip()` idiom already ignored above for tests/characterisation/conftest.py
# -- ``.strip()`` here removes a *set* of characters, not the literal
# suffix, which is almost certainly not what the author intended, but
# "fix" and "change what the idiom does" are the same edit for a
# character-class strip, so it is left alone rather than swapped for
# ``removesuffix``).
# B008 (`np.array(...)` in a default argument) is the same idiom the
# tests/characterisation/conftest.py ignore above already names as
# deliberately mirroring "the legacy example's ASimpleModel signature" --
# these five files are that example, in its several inference-backend
# variants.
"examples/cstar_model_test_sbi_v2.py" = ["B005"]
"examples/example.py" = ["B005"]
"examples/minimal_working_example.py" = ["B005", "B008"]
"examples/minimal_working_example_dynesty.py" = ["B005", "B008"]
"examples/minimal_working_example_sbi.py" = ["B005", "B008"]
"examples/minimal_working_example_sbi_embedding.py" = ["B005", "B008"]
"examples/minimal_working_example_zeus.py" = ["B005", "B008"]
"examples/star_disc.py" = ["B005"]
# F821 (undefined name): three scripts reference a name that was never
# defined in scope (`modwaves`/`data`/`dataSet` in modbbtest.py,
# `DualBlackBodyDust`/`spec` in modelClio.py, `optimiser_emcee` in
# cstar_model_test_sbi_v2_embedding.py's crash-recovery pickle at the very
# end). These are pre-existing bugs in demonstration scripts that already
# do not run to completion as written; guessing the intended name would be
# a behaviour change this item is not scoped to make, so the finding is
# ignored rather than "fixed" by assumption.
"examples/modbbtest.py" = ["F821"]
"examples/modelClio.py" = ["F821"]
"examples/cstar_model_test_sbi_v2_embedding.py" = ["B005", "F821"]

# ruff format is the formatter (replaces the historical black config,
# which was never wired into CI/pre-commit and had drifted -- py38/py39
# target versions predating the >=3.11 packaging floor set in W0.3).

# ---------------------------------------------------------------------------
# pytest (W2.10). Markers only: no `testpaths`, no `addopts`, so every
# invocation in this file's [tool.pixi.tasks] and in CI behaves exactly as it
# did before this section existed. What it buys is a registered marker, and
# therefore no `PytestUnknownMarkWarning` on the one suite that needs one.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
markers = [
    # W2.10, milestone M2. The full size ladder (2 000 and 20 000 points) and
    # the cross-backend comparison at the milestone budget: tens of minutes,
    # so it is deliberately NOT in the PR gate. `tests/m2/conftest.py` skips
    # these unless `-m m2_full` asks for them, which is why no `addopts`
    # deselection is needed here -- and why `pytest tests/m2` stays fast for
    # anyone who runs it without reading this file first.
    "m2_full: milestone M2's full size ladder; run with `pytest -m m2_full`",
    # W4.4. The interferometry study's longer runs (the documentation budget,
    # the full calibration count): tens of minutes, so deliberately NOT in the
    # PR gate. `tests/interferometry/conftest.py` skips these unless
    # `-m interferometry_full` asks for them, in `tests/m2/conftest.py`'s own
    # shape and for its own reason.
    "interferometry_full: the interferometry study's full budget; run with `pytest -m interferometry_full`",
    # W5.5. The image study's longer runs (the 128x128 benchmark cell, the
    # full SBC count): the same reasoning as the line above.
    "image_full: the image study's full budget; run with `pytest -m image_full`",
    # W5.22. The population study's full 200-object archive (fitting and
    # timing 200 emcee runs): minutes, so deliberately NOT in the PR gate.
    # `tests/results/conftest.py` skips these unless `-m population_full`
    # asks for them, in the same shape as the marker above; a 50-object
    # reduced sibling stays in the default gate.
    "population_full: the population study's full 200-object archive; run with `pytest -m population_full`",
    # W5.9. The astrometry example's calibration study at the count where SBC
    # has power (two arms x 48 refits, tens of minutes): the same reasoning as
    # the three lines above, with a reduced-budget sibling that always runs.
    "astrometry_full: the astrometry calibration study's full budget; run with `pytest -m astrometry_full`",
    # W5.14. The engine battery's SBC at the count where Talts et al.'s
    # uniformity test has power (100 refits per engine, several minutes each):
    # the same reasoning as the four lines above, with a reduced 8-simulation
    # sibling that always runs and checks the machinery rather than the
    # statistic. `tests/inference/conftest.py` skips these unless
    # `-m engines_full` asks for them, in `tests/m2/conftest.py`'s own shape
    # and for its own reason.
    "engines_full: the engine battery's full SBC budget; run with `pytest -m engines_full`",
    # W5.26, project-wide since W5.32 (i). A study row that samples on the
    # reference backend only and asserts a claim about the *likelihood* (or
    # about `ampere.results` machinery, or a study's own recovery, exercised
    # through a reference-backend run) -- never about the array library.
    # `tests/m2/test_backend_agreement.py` and the per-backend rows elsewhere
    # already prove the backends agree with the reference implementation, so
    # re-running these rows' own sampling in `torch`, `jax` or `sbi` buys no
    # additional evidence, only their wall clock. `tests/conftest.py` skips
    # `study` rows wherever a modern backend is importable, project-wide, so
    # they run in `dev` only -- unlike the `*_full` markers above, this is
    # not opt-in by `-m`; it is opt-out by environment.
    "study: a study's numpy-path-only sampling row; skipped outside `dev` (see tests/conftest.py)",
    # W6.6 (c). Replaces W5.18's 26 `--deselect=tests/inference/test_sbi.py::...`
    # flags on `test-fast` (below) with one marker on the classes that train
    # an sbi network -- minutes each, so still deliberately out of `test-fast`,
    # but a marker rather than a per-node deselect list now that W5.32 (i)
    # settled this markers list's shape. Applied to the 26 `@needs_sbi`
    # classes in `tests/inference/test_sbi.py` that call `.run(...)`/train,
    # plus `tests/inference/test_interferometry.py`'s one training class.
    # Unlike `study` above, `dev` never needs an opt-out here: these classes
    # already skip in `dev` for want of the `sbi`/`torch` extra, so the
    # marker only matters in `-e sbi` and `-e torch`, where `test-all` and
    # CI's sbi cell run them (`pytest -m sbi_training` selects just these).
    "sbi_training: trains an sbi network (minutes); excluded from test-fast, run by test-all/CI's sbi cell",
]

# ---------------------------------------------------------------------------
# pixi (W0.8): environment management wraps pyproject.toml rather than
# duplicating it. Python itself comes from conda-forge (pixi needs a conda
# interpreter); every other dependency -- [project.dependencies] and
# whichever [project.optional-dependencies] extras a feature below asks
# for -- comes from installing `ampere` itself as an editable PyPI
# dependency (the pixi equivalent of `pip install -e ".[...]"`), so
# pyproject.toml stays the single source of truth. No package version is
# pinned twice.
# ---------------------------------------------------------------------------

[tool.pixi.workspace]
channels = ["conda-forge"]
# Matches the project's sole OS classifier (`Operating System :: POSIX ::
# Linux`, [project.classifiers] above).
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
ampere = { path = ".", editable = true }

[tool.pixi.tasks]
# Fast tests: the import-quarantine suite (tests/test_imports.py) --
# everything else quick enough to belong here already lives there. The
# slow suite is test-characterisation, below.
test = "pytest tests/test_imports.py"
test-characterisation = "pytest tests/characterisation"
# W1.10: the backend-parametrised battery every backend must pass. Runs
# against the in-repo reference and mirror fixtures today; a Phase-2 backend
# joins by registering one fixture (tests/conformance/README.md).
conformance = "pytest tests/conformance"
# W0.10: named tasks for the other two Phase 1 suites, so CI (and anyone
# working locally) invokes them the same way as `test-characterisation` and
# `conformance` above rather than a raw pytest line. `test-phase1` runs all
# three Phase-1 suites (core, results, conformance) in ONE pytest process --
# this is not just for speed: it is the invocation that proves
# tests/core/conftest.py's registry-snapshot fixture actually stops a
# likelihood-family registration leaking from `tests/core` into
# `tests/conformance`'s check that the marginalisation table covers exactly
# the registered family set (finding (c) in this item; each suite passing
# alone does not catch it -- see tests/core/conftest.py's docstring).
test-core = "pytest tests/core"
test-results = "pytest tests/results"
test-phase1 = "pytest tests/core tests/results tests/conformance"
# W2.1: unit tests for the shipped backends -- the physics and the steps the
# backend-neutral conformance battery has no declaration for (the LSF, the
# real pyphot-backed synthetic photometry). The contract rows stay in
# tests/conformance, which runs them once per registered backend.
test-backends = "pytest tests/backends"
# W2.2: the engine drivers. End-to-end sampling runs, so this is the slowest
# of the new-namespace suites (tens of seconds); the budgets are deliberately
# small and the seeds fixed -- see the module docstring for the trade-off.
test-inference = "pytest tests/inference"
# W2.9: the shipped examples actually run. W2.11 puts it in a gate (below):
# an example that only the docs build exercises is an example that
# `nbsphinx_allow_errors = True` lets rot silently.
test-examples = "pytest tests/examples"
# W2.10, milestone M2: the misspecification study's CI-runnable assertions.
# About 100 s in `dev` (eight short emcee runs, shared by a session fixture)
# and about five minutes in `torch` or `jax`, where the cross-backend
# comparison adds four more. Its own task as well as a member of `test-all`
# below, because it is the one suite somebody re-runs on its own while
# changing a threshold.
#
# The full size ladder (2 000 and 20 000 points, milestone budgets) is
# deliberately NOT here: `pytest tests/m2 -m m2_full`, tens of minutes.
test-m2 = "pytest tests/m2"
# Everything the new namespaces own, in ONE pytest process, for the same
# registry-leak reason test-phase1 exists (see tests/core/conftest.py).
# W2.11 added tests/examples: it loads `examples/wstat_comparison.py`, which
# registers a likelihood family at module scope exactly as a user's module
# would, so it is precisely the kind of suite that must be proved not to leak
# into tests/conformance's registered-family check rather than kept apart from
# it. tests/examples/conftest.py already snapshots and restores the registry
# for that reason; this is what keeps that honest.
# W2.10 added tests/m2 for the same reason, and for one more: `tests/m2`
# imports `examples/m2_misspecification`, which composes problems from
# whichever backend the environment has, so running it in the same process as
# `tests/conformance` is what proves the study registers nothing global.
# W5.26 added tests/interferometry (W4.4, 22 rows) and tests/astrometry
# (W4.9, 40 rows): both were landed with their own `*_full` opt-in markers
# but never joined this task or any `ci.yml` step, so neither ran anywhere
# from the day it landed. Neither registers anything global (grep finds no
# `register_family`/`register_lowering` call in either directory or the
# `examples/{interferometry,astrometry}` modules they exercise), so their
# addition adds no new registry-leak concern -- they join this one process
# for the same reason `tests/backends` and `tests/inference` did: this is the
# one invocation that is the actual per-environment gate.
# W6.10 (the xdist audit; the table is in docs/development.md, "The merged
# gate"): `-n 4`, not `-n auto` -- CI runners and the 16-core, 13 GB
# development machine differ, and `auto` there is a memory hazard for the
# torch and jax legs. `--dist loadgroup` keeps `tests/interferometry` and
# `tests/astrometry` (correct under xdist but slower for it; their rows carry
# an `xdist_group` marker from `tests/conftest.py`) on one worker each, and
# one BLAS thread per process stops four workers oversubscribing the cores.
# Measured (dev, 2026-10-02): 36 min 19 s serial -> 19 min 40 s, counts
# identical (3290 passed / 645 skipped). `-n 0` restores a serial run.
test-all = { cmd = "pytest -n 4 --dist loadgroup tests/core tests/results tests/conformance tests/backends tests/inference tests/examples tests/m2 tests/interferometry tests/astrometry", env = { OMP_NUM_THREADS = "1", OPENBLAS_NUM_THREADS = "1", MKL_NUM_THREADS = "1" } }
# W5.18: the local pre-commit run -- docs/orchestration.md's "Make a fast
# gate" rule. The contract-and-backend tier of `test-all` above: `tests/core`,
# `tests/results`, `tests/conformance`, `tests/backends`, `tests/inference`
# and `tests/m2`'s backend-agreement rows, minus the things below that do
# not belong in a sub-four-minute check. **Ruled by Peter 2026-09-27** on
# the measurement: the item first asked for `test-all` minus the study and
# training rows, which measured 14 min 02 s in dev (3021 passed / 460
# skipped / 229 deselected); `--durations` showed ~590 s of that in twenty
# rows, nearly all of them example and modality-study smoke rows, so:
#   * the three example suites (`tests/examples`, `tests/interferometry`,
#     `tests/astrometry`) are not in this task's list at all -- they are
#     the studies' smoke tier (the W5.15 per-PR dynesty pin alone is 141 s,
#     the interferometry calibration fixtures 83 s + 44 s, the image and
#     interferometry study CLIs 50 s + 35 s + 17 s + 17 s) and CI's
#     `studies` group runs them; `test-all` still runs everything.
#   * two slow `tests/results` classes are deselected by node id with their
#     measured cost: `test_plots.py::TestCornerPaging` (75 s across four
#     rows: a 200-element plate paged into ten corner figures) and
#     `test_calibration.py::TestTheRefitLoop` (27 s: real emcee refits).
#     Everything else in core/results/conformance/backends/inference is
#     about four minutes together, spread over ~3000 rows.
#   * `test-all -m "not study"` is the 14-minute middle tier for anyone who
#     wants the example suites too; it is one flag away and not a task.
#   * every `*_full` marker (`m2_full`, `interferometry_full`,
#     `image_full`, `population_full`, `astrometry_full`, `engines_full`
#     -- the `markers` list above) is already opt-in by `-m`, so it is
#     excluded here simply by never passing `-m m2_full` etc.; no `-m`
#     clause is needed and repeating the list in one would drift from the
#     `markers` list, which is not this task's line to edit.
#   * `study` rows (`-m "not study"`): numpy-path-only sampling rows
#     (tests/m2, tests/results) that run by default in `dev` -- W5.26
#     measured them at about 18 minutes there -- and are only skipped by
#     tests/m2/conftest.py's/tests/results/conftest.py's own hook outside
#     `dev`; that hook does not fire in `dev`, so `dev` needs this
#     explicit deselection to stay fast.
#   * the SBI-training classes: W6.6 (c) replaced the 26 `--deselect`
#     flags this bullet used to describe (one per `tests/inference/test_sbi.py`
#     class, identified by `@needs_sbi` together with a `budget=`/`.run(...)`
#     training call) with the `sbi_training` marker registered in the
#     `markers` list above, now that W5.32 (i) settled that list's shape.
#     `-m "not study and not sbi_training"` below excludes them, plus
#     `tests/inference/test_interferometry.py::TestSBIOnVisibilitiesAndClosurePhases`,
#     the interferometry study's own training class, which joins the same
#     marker here for the same reason. `dev` has neither the `torch` nor
#     the `sbi` extra, so every one of these rows already skips for free
#     here (the marker changes nothing about `dev`'s wall clock); it is
#     what keeps this task fast if it is ever run under `-e sbi` or
#     `-e torch`, which is the point of a task meant to be run before every
#     commit, not only in `dev`. (`tests/inference/test_tmnre.py` does not
#     exist: the TMNRE classes live inside `test_sbi.py` and carry the same
#     marker -- `TestWhatTMNRERefuses` does not train and is not marked.)
# Measured on this branch (2026-09-27, `pixi run -e dev test-fast`, one run
# through the machine's gate lock, before W6.6 (c)'s marker swap): 2879
# passed / 425 skipped / 244 deselected in 2 min 55 s (3 min 02 s wall
# clock with pixi's start-up); 3299 of 3543 collected rows selected. W6.6
# (c) (2026-09-28, `--collect-only`, tree since grown): 3311/3555 collected
# (244 deselected) under the old 26-deselect form, 3306/3555 collected (249
# deselected) under this marker form -- five fewer, exactly
# `TestSBIOnVisibilitiesAndClosurePhases`'s five test methods, the one class
# that newly joins the exclusion; `dev`'s wall clock is unaffected either
# way, since that class already skipped there for want of the `sbi` extra.
# W6.10: `-n 4` as for `test-all` above. Measured (dev, 2026-10-02): 4 min
# 54 s serial (`-n 0`) -> 2 min 32 s, 2951 passed / 444 skipped both ways.
test-fast = { cmd = "pytest -n 4 --dist loadgroup tests/core tests/results tests/conformance tests/backends tests/inference tests/m2 -m \"not study and not sbi_training\" --deselect=tests/results/test_plots.py::TestCornerPaging --deselect=tests/results/test_calibration.py::TestTheRefitLoop", env = { OMP_NUM_THREADS = "1", OPENBLAS_NUM_THREADS = "1", MKL_NUM_THREADS = "1" } }
# W5.26 (3): `ci.yml`'s `suites` (dev) and `backend-suites`
# (torch/jax/sbi/nested) jobs run these three groups as separate matrix
# cells instead of `test-all` as one forty-minute step, so a red row in one
# group no longer hides every other group's result in the same leg. Two of
# the three carry a registry-leak proof and must keep their paired suite in
# one process (test-all's own comment above, restated per group):
#   * test-group-core:      tests/core tests/results tests/conformance
#     -- the original test-phase1 pairing: a family/lowering row registered
#     in tests/core (or the contracts doctest `test_spec_doctests.py` runs)
#     must not leak into tests/conformance's registered-family check.
#   * test-group-backends:  tests/conformance tests/backends tests/inference
#                            tests/examples
#     -- the W2.11 pairing: tests/examples loads a user-style module that
#     registers a likelihood family at import; tests/examples/conftest.py
#     snapshots and restores the registry around it, and running
#     tests/conformance's registered-family check in the same process is
#     what proves that fixture still works (the review of this item restored
#     the pairing: a fixture whose correctness is only asserted by
#     co-location is not proved by a group that omits the co-location).
#   * test-group-studies:   tests/conformance tests/m2 tests/interferometry
#                            tests/astrometry
#     -- the W2.10 pairing above, extended to the two suites this item adds:
#     neither registers anything today, but grouping every backend-composing
#     study suite with tests/conformance keeps that proof extensible rather
#     than something a future study has to remember to ask for.
#   tests/conformance therefore runs in every group (about one to three
#   minutes per environment): it is the registry oracle, and each group is
#   a subset of test-all, so a local run and a CI cell still agree.
# Local: `test-all` (this task) is unchanged in meaning and stays the one
# single-process gate a developer runs; the three tasks below exist for CI's
# matrix and are equally valid to run locally when only one group's result
# is wanted.
test-group-core = "pytest tests/core tests/results tests/conformance"
test-group-backends = "pytest tests/conformance tests/backends tests/inference tests/examples"
test-group-studies = "pytest tests/conformance tests/m2 tests/interferometry tests/astrometry"
# W2.5/W2.4 slice 3: the GPU smoke tests. Skipped wherever `jax.devices()`
# (or torch's CUDA/MPS query) reports no accelerator, which is every ordinary
# machine and all of CI -- CI is CPU-only by ruling and W2.11 pins CPU wheels
# to keep it that way. Outside every gate for that reason: a suite that can
# only skip in CI belongs where somebody runs it deliberately, on hardware.
gpu = "pytest tests/gpu"
# W2.3: the GP solvers' wall-clock scaling, 10^3-10^5 points. Deliberately
# outside every gate above -- a dense 3000-point solve alone costs seconds --
# and run on demand. -s so the measured table reaches the terminal.
scaling = "pytest tests/scaling -s"
# W2.11: the tracked benchmark suite. One command locally, and the same
# command in CI, which uploads `benchmark.json` as the run's artefact.
# `--benchmark-json` is what makes a run comparable with another run rather
# than a number that scrolls past; `--benchmark-columns` keeps the terminal
# table to the statistics that mean anything on a shared runner.
# tests/benchmarks/test_gp_solvers.py's module docstring carries the harness
# choice, and what is deliberately not measured here.
bench = "pytest tests/benchmarks --benchmark-json=benchmark.json --benchmark-columns=min,median,stddev,rounds"
lint = "ruff check ."
format-check = "ruff format --check . --exclude tests/characterisation"
# pyrefly is scoped to the new namespaces (AGENTS.md ground rule 8); none
# of them exist yet, and a bare `pyrefly check ampere/core ampere/backends
# ampere/inference ampere/results` errors ("No Python files matched
# pattern ...") when a given directory is missing, so this must check
# which of the four exist and exit 0 cleanly when none do.
#
# W2.4/W2.5: it must also check which of them can be *imported*. A backend
# subpackage is the one place in ampere that imports its array library at
# module top level (architecture.md §4 rule 2), so `ampere/backends/torch` or
# `ampere/backends/jax` in the `dev` environment -- which deliberately has
# neither extra -- is a pile of unresolvable imports rather than a pile of type
# errors. Excluding a backend whose library is absent keeps the daily-use gate
# meaningful instead of permanently red, and the backend is still checked with
# its real types in the environment that has its dependencies:
# `pixi run -e torch typecheck` / `pixi run -e jax typecheck`. (W2.4 had used
# `--ignore-missing-imports` per library for the same purpose; the exclude form
# needs no per-library list and was kept at the merge.)
typecheck = "bash -c 'dirs=\"\"; excludes=\"\"; for d in ampere/core ampere/backends ampere/inference ampere/results; do [ -d \"$d\" ] && dirs=\"$dirs $d\"; done; for b in torch jax; do if [ -d \"ampere/backends/$b\" ] && ! python -c \"import $b\" >/dev/null 2>&1; then echo \"typecheck: skipping ampere/backends/$b -- $b is not installed here; run pixi run -e $b typecheck\"; excludes=\"$excludes --project-excludes=ampere/backends/$b/**\"; fi; done; if [ -z \"$dirs\" ]; then echo \"typecheck: none of ampere/{core,backends,inference,results} exist yet -- nothing to check\"; else pyrefly check $excludes $dirs; fi'"
docs = "sphinx-build -W --keep-going -b html docs/source docs/_build/html"
# W4.10 (3): `actionlint` validates `.github/workflows/*.yml` -- action
# inputs, expression syntax, embedded `run:` shell via shellcheck, the lot.
# It ships as a binary on conda-forge (`pixi search actionlint`), so this is
# a pixi task like every other check here rather than a separate
# GitHub-Action-only step; CI's `actionlint` job runs the same task.
actionlint = "actionlint"

# --- One feature per Python interpreter, driving the CI matrix (W0.3
# packaging floor, raised 2026-09-22: requires-python >=3.12; CI targets
# 3.12-3.14 -- 3.11 dropped because arviz 1.x needs 3.12 and 3.11 had a year
# of security fixes left; the freed leg became 3.14) ---
[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

# --- One feature per [project.optional-dependencies] extra, mirrored 1:1
# via the editable install's `extras`, never duplicated here. ---
[tool.pixi.feature.dev.pypi-dependencies]
ampere = { path = ".", editable = true, extras = ["dev"] }

# W2.11: the docs build's two environment-level requirements, declared here
# rather than assumed to be on the machine. `pixi run docs` was red on master
# for exactly these two reasons, which is worse than having no docs gate at
# all -- a task nobody can run is a task nobody trusts.
#
# `pandoc` is a binary nbsphinx shells out to for every notebook it renders
# (Markdown cells -> reStructuredText); it is not a Python package, so it can
# only come from the conda side. `ipykernel` installs the `python3` kernelspec
# under the environment prefix, which is what nbsphinx needs to *execute* a
# notebook that carries no stored outputs -- and this repository commits no
# run outputs (AGENTS.md ground rule 7), so every notebook here that is not
# excluded is executed at build time by construction.
#
# `actionlint` (W4.10 (3)): a Go binary, packaged on conda-forge, so it
# joins `pandoc` here rather than needing a separate download step in CI --
# `pixi run -e dev actionlint` (the task above) works the same way locally
# and in the `actionlint` CI job.
[tool.pixi.feature.dev.dependencies]
pandoc = "*"
ipykernel = "*"
actionlint = "*"

[tool.pixi.feature.zeus.pypi-dependencies]
ampere = { path = ".", editable = true, extras = ["zeus"] }

[tool.pixi.feature.sbi.pypi-dependencies]
ampere = { path = ".", editable = true, extras = ["sbi"] }
# Same CPU-wheel pin, same reason, as the `torch` feature below: the `sbi`
# extra depends on torch, so without this line the weekly
# `sbi-characterisation` job downloads the ~2 GB CUDA build too, to run on a
# CPU-only hosted runner.
torch = { version = "*", index = "https://download.pytorch.org/whl/cpu" }

[tool.pixi.feature.extinction.pypi-dependencies]
ampere = { path = ".", editable = true, extras = ["extinction"] }

# W5.14: one feature per new sampler extra, mirrored the same 1:1 way. They
# are separate features rather than one `nested` feature over both extras so
# that the mirror stays exact -- a feature here names exactly one extra of
# [project.optional-dependencies] -- and the *environment* below is where the
# two are composed.
[tool.pixi.feature.nautilus.pypi-dependencies]
ampere = { path = ".", editable = true, extras = ["nautilus"] }

[tool.pixi.feature.ultranest.pypi-dependencies]
ampere = { path = ".", editable = true, extras = ["ultranest"] }

[tool.pixi.feature.blackjax.pypi-dependencies]
ampere = { path = ".", editable = true, extras = ["blackjax"] }

# W2.2: arviz and h5netcdf are base dependencies now (see
# [project.dependencies]), so this feature no longer carries the results
# capability -- every environment has it, including the CI matrix. What is
# left is the *second* netCDF engine: `tests/results/test_results.py`'s
# `test_both_netcdf_engines_write_it` asserts that a stored run is readable
# whichever engine wrote it, and `importorskip`s netCDF4 when it is absent, so
# without this feature that row would silently skip in the daily-use
# environment. Named `netcdf` rather than `arviz` because that is now what it
# is for. (Superseded W1.8's `arviz` feature, which pinned the extra plus all
# three of h5netcdf/h5py/netcdf4.)
[tool.pixi.feature.netcdf.pypi-dependencies]
netcdf4 = "*"

# Backend placeholders (Phase 2): [project.optional-dependencies] already
# stubs these (torch = ["torch"], jax = ["jax"]); wiring the pixi features
# up now means the eventual backend split doesn't also need a pixi change.
[tool.pixi.feature.torch.pypi-dependencies]
ampere = { path = ".", editable = true, extras = ["torch"] }
# W2.11 (ruled 2026-09-07): `torch` from PyPI's default index resolves, on
# linux-64, to the CUDA build -- 2.13.0+cu130 here, which drags in fifteen
# `nvidia-*` wheels and roughly 2 GB of CUDA runtime that nothing in this
# project uses. Hosted CI runners are CPU-only (DEVELOPMENT_PLAN.md §5's
# "GPU tests are nightly/manual" is a statement about that), so the download
# is pure cost: it is the single largest item in the torch environment and it
# would sit in every CI cache and every developer's `.pixi/`.
#
# Pinning the *package* to PyTorch's CPU index (rather than adding it as an
# extra index) is deliberate: with an extra index, uv's default first-match
# strategy still prefers PyPI, so the CUDA wheel would win anyway. Everything
# else in this feature -- `pyro-ppl`, and the base dependencies via the
# editable `ampere` above -- keeps resolving from PyPI as usual.
#
# This changes only what *this project's* torch environment installs. It does
# not touch [project.optional-dependencies]'s `torch = ["torch", "pyro-ppl"]`,
# so `pip install "ampere[torch]"` still gives a user whatever their platform's
# default wheel is, GPU included. A GPU environment, when the GPU smoke-test
# item arrives, is a new pixi feature that omits this line -- not an edit to it.
torch = { version = "*", index = "https://download.pytorch.org/whl/cpu" }

[tool.pixi.feature.jax.pypi-dependencies]
ampere = { path = ".", editable = true, extras = ["jax"] }

# W6.16: the GPU environment, for the `tests/gpu` rows on the cluster (run by
# hand at the release gate; see docs/development.md, "The GPU rows on the
# cluster"). The one environment that carries torch *and* jax -- deliberately:
# the rows exercise both backends on one accelerator node. Locked, never
# installed on the development machine (a CUDA torch plus a CUDA jax is several
# gigabytes). The cluster's driver version was not known at dispatch, so both
# are the CUDA 12 wheel family -- bundled CUDA libraries, a driver of 525 or
# newer: torch from PyTorch's `cu126` index (the newest cu12x index that
# publishes the torch version the other environments lock, 2.14.1; `cu128` and
# `cu129` stop at 2.11 and 2.13) and `jax[cuda12]`. This feature omits the
# `torch` feature's CPU-index pin, as that pin's comment instructs; it does not
# edit it.
[tool.pixi.feature.gpu.pypi-dependencies]
ampere = { path = ".", editable = true, extras = ["torch", "jax"] }
torch = { version = "*", index = "https://download.pytorch.org/whl/cu126" }
jax = { version = "*", extras = ["cuda12"] }

# W6.9: the RHMF trial's feature -- the extra's name, but the *commit* the trial
# was run against rather than the PyPI release (0.0.2, 2025-11-24, which is
# behind the repository by the referee-response work and carries no licence
# metadata). `ampere`'s own `rhmf` extra is not repeated here: it would
# resolve the release and fight this pin.
[tool.pixi.feature.rhmf.pypi-dependencies]
robusta-hmf = { git = "https://github.com/TomHilder/robusta-hmf", rev = "cf2fcffa10bc6b150b6cdee76cb18980bbe908ef" }

# W6.13 (5), D12 (b): the carbon-star twin's physics, `examples/cstar/`.
# Deliberately a pixi feature and *not* a [project.optional-dependencies]
# extra, so the 1:1 extra mirror above does not apply: Hyperion is a
# Fortran Monte Carlo radiative-transfer code packaged on conda-forge only
# (`hyperion` is the Python front end, `hyperion-fortran` the
# `hyperion_sph` binaries), so no pip extra could deliver it. It is an
# example-only requirement -- nothing under `ampere/` imports it -- and the
# twin's tests skip by `find_spec` where it is absent. `miepython` replaces
# the legacy's unpackaged `bhmie` Fortran step (ruled 2026-09-28 on
# `docs/design/example_dependencies_memo.md` §3). Pinned at 0.9.11, the
# last release, which conda-forge builds for Python <= 3.13, until upstream
# releases this year's fixes.
[tool.pixi.feature.hyperion.dependencies]
hyperion = "0.9.11.*"
hyperion-fortran = "0.9.11.*"
miepython = ">=3.3"

[tool.pixi.environments]
# W0.10 finding (b): without an explicit `default` entry here, pixi
# synthesises one from only the base [tool.pixi.pypi-dependencies] table
# (just the editable `ampere` install, no extras) -- no `python` feature
# means no version pin, so it solves to conda-forge's newest available
# interpreter (found to be 3.14 -- since 2026-09-22 inside this project's
# tested 3.12-3.14 range, see [project.classifiers]), and no `dev` feature
# means no pytest.
# `pixi run <task>` with no `-e` targets that implicit `default`
# environment; since pytest isn't present in it, the task falls through to
# whatever `pytest` is first on $PATH -- typically an unrelated
# system/conda install with no knowledge of this checkout at all, so it
# reports `ModuleNotFoundError: No module named 'ampere'` from a worktree
# (or worse, silently runs against a *different* ampere checkout's install
# if one happens to be on PATH). Aliasing `default` to the same feature set
# as `dev` fixes both problems at once -- a pinned, supported Python *and*
# pytest actually present -- rather than pinning the Python version alone,
# which would leave the missing-pytest half of the failure unfixed. This
# makes plain `pixi run <task>` behave exactly like `pixi run -e dev
# <task>`, the daily-use environment AGENTS.md documents. The shared
# `solve-group` ties the two to the same locked package set -- without it,
# `default` and `dev` solve independently and can drift to different exact
# builds of the same versions on a future `pixi lock`/`pixi update`, which
# would quietly contradict "behaves exactly like dev".
default = { features = ["py313", "dev", "zeus", "extinction", "netcdf"], solve-group = "dev" }
# Daily-use environment: latest supported Python plus the full non-sbi,
# non-backend toolchain (mirrors AGENTS.md's conda `ampere` env, which is
# Python 3.13). Kept as its own named environment (rather than relying on
# `default` alone) so `pixi run -e dev <task>` -- used throughout ci.yml and
# AGENTS.md -- keeps working unambiguously even if `default` above ever
# needs to diverge.
dev = { features = ["py313", "dev", "zeus", "extinction", "netcdf"], solve-group = "dev" }
# CI test matrix: one environment per Python version. Deliberately no
# `sbi` extra here -- torch is a large download and sbi tests skip cleanly
# by design (tests/characterisation/conftest.py's `requires_sbi` marker);
# see ci.yml and this item's report for the full rationale.
test-py312 = { features = ["py312", "dev", "zeus", "extinction"] }
test-py313 = { features = ["py313", "dev", "zeus", "extinction"] }
test-py314 = { features = ["py314", "dev", "zeus", "extinction"] }
# Full characterisation run including the sbi flow. sbi (extras =
# ["sbi"]) already depends on torch (pyproject.toml sbi = ["torch",
# "sbi<0.28"]), so torch is not listed separately here. Kept out of the
# default test-py3* matrix -- see ci.yml's non-blocking
# sbi-characterisation job.
# W3.2 (2026-09-09): the `torch` feature joins this environment. The `sbi`
# extra installs torch but not pyro-ppl, and tests/inference's torch NUTS/VI
# rows and tests/m2's torch agreement rows do not skip without pyro -- so the
# environment's `test-all` had been red since W2.11 created it. With `torch`
# here the environment is `torch` + sbi, which is also what a user who runs
# SBI on the torch backend actually has. Same CPU-index pin either way.
sbi = { features = ["py313", "dev", "zeus", "extinction", "netcdf", "torch", "sbi"] }
# Backend environments (W2.4 for torch, W2.5 for jax): each is the daily-use
# `dev` feature set plus its backend extra, not a bare `dev + backend`. The
# items' gate is `pixi run -e <backend> test-all`, which runs all five
# new-namespace suites in one process, and `tests/inference` exercises all
# the engine drivers -- including zeus, which is an extra: without it, 48 of
# that suite's rows error on `OptionalDependencyError` for a reason that has
# nothing to do with the backend under test. `netcdf` is here for the same
# reason at one remove (`tests/results`' both-engines row importorskips
# netCDF4), and `extinction` completes the match with `dev`, so a count taken
# here is comparable with one taken in `dev`. `pixi run -e <backend>
# typecheck` likewise sees `ampere/inference/_zeus.py`'s lazy import resolved.
#
# Deliberately not sharing `dev`'s solve group: the point of the split is that
# `dev` never resolves torch or jax at all (`architecture.md` §4 rule 2).
torch = { features = ["py313", "dev", "zeus", "extinction", "netcdf", "torch"] }
# W5.14: blackjax is *folded into the existing jax environment* rather than
# given one of its own. It is a jax-only driver over the jax backend's
# realisation, so the only environment in which its rows can run at all is
# this one, and a separate `blackjax` environment would be the jax
# environment plus one small pure-python wheel -- a second half-gigabyte jax
# install and a second CI leg for nothing. Its tests therefore run on the
# existing jax leg (W5.26: "new-namespace suites (jax, backends)", the
# `test-group-backends` cell -- `tests/inference/test_blackjax.py` lives
# under `tests/inference`), whose path gate already covers
# `ampere/inference/**` and `ampere/backends/jax/**`.
jax = { features = ["py313", "dev", "zeus", "extinction", "netcdf", "jax", "blackjax"] }
# W6.9: the RHMF trial's environment -- the `jax` environment's feature set plus
# the `rhmf` feature, so that whether `ampere[jax]`'s JAX pin and
# `robusta-hmf`'s are mutually satisfiable (`diagnostics.md` §2.7) is answered
# by this environment's lock solving or not. A trial's environment, absent
# from CI (a new leg is W6.5's or W6.16's call).
rhmf = { features = ["py313", "dev", "zeus", "extinction", "netcdf", "jax", "blackjax", "rhmf"] }
# W5.14: the nested-sampling pair, in their own small environment. Not folded
# into `dev`, which is the environment every work item's gate runs and which
# is deliberately the *base* toolchain: two more nested samplers there would
# be a standing tax on every wave for engines most items do not touch.
# Not folded into `torch`/`jax`/`sbi` either -- these two are gradient-free
# and numpy-only, so they have no business behind a backend download. The
# feature set is `dev`'s, exactly as the backend environments' is, so a count
# taken here is comparable with one taken in `dev`, and the environment is
# small: nautilus adds scikit-learn, ultranest adds corner, and matplotlib is
# already here.
nested = { features = ["py313", "dev", "zeus", "extinction", "netcdf", "nautilus", "ultranest"] }
# W6.13 (5): the carbon-star twin's environment -- the `sbi` environment's
# feature set, because the twin fits with `SBIEngine`, plus the conda-forge
# `hyperion` feature above. An example-only requirement (D12 (b)), not an
# extra, and absent from CI by ruling: the twin's Hyperion rows skip in
# every CI environment and are run by hand here.
hyperion = { features = ["py313", "dev", "zeus", "extinction", "netcdf", "torch", "sbi", "hyperion"] }
# W6.16: the GPU rows' environment (the `gpu` feature above). Its own solve
# group, so no other environment's lock section can move when it is re-solved.
gpu = { features = ["py313", "dev", "zeus", "extinction", "netcdf", "gpu"], solve-group = "gpu" }

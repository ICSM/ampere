[build-system]
requires = ["setuptools>=77.0.3", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "ampere"
# version = "0.1.2"
dynamic = ["version"]
# SPDX expression (PEP 639); the shipped licence text is GPLv3, and
# ampere/__init__.py declares "version 3 ... or (at your option) any later
# version".
license = "GPL-3.0-or-later"
license-files = ["licenses/gpl.txt"]
description = ""
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "astropy>=4.0.0",
    "scipy",
    "matplotlib",
    "spectres",
    "tqdm",
    "pyphot<2",  # TEMPORARY pin: legacy photometry uses pyphot.unit, removed in pyphot 2; lift via W0.9 forward-migration
    "emcee",
    "dynesty",
    "corner",
]

[[project.authors]]
name = "Peter Scicluna"
email = "peter.scicluna@eso.org"

[[project.authors]]
name = "Francisca Kemper"

[[project.authors]]
name = "Sundar Srinivasan"

[[project.authors]]
name = "Jonathan Marshall"

[[project.authors]]
name = "Oscar Morata"

[[project.authors]]
name = "Alfonso Trejo"

[[project.authors]]
name = "Sascha Zeegers"

[[project.authors]]
name = "Lapo Fanciullo"

[[project.authors]]
name = "Thavisha Dharmawardena"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/icsm/ampere"
"Bug Tracker" = "https://github.com/icsm/ampere/issues"

[project.optional-dependencies]
# Backend extras are placeholders for the Phase 2 backend split; they will
# grow pinned/qualified requirements as the backends land.
torch = ["torch"]
jax = ["jax"]
sbi = ["torch", "sbi<0.28"]  # TEMPORARY upper pin at the tested version; lift via W0.9/Phase 3
zeus = ["zeus-mcmc"]
arviz = ["arviz"]
# W0.5: replaces the abandoned 'extinction' package (issue #75) for
# ampere.models.extinctionModels.F99Extinction; imported lazily, so it is
# optional rather than a core dependency.
extinction = ["dust_extinction"]
dev = [
    # test + coverage
    "pytest",
    "pytest-cov",
    "coverage",
    # lint/format + types
    "ruff",
    "pyrefly",
    # docs
    "sphinx",
    "nbsphinx",
    "nbconvert",
]
# Every feature extra (not dev) composed; self-referential extras are
# supported by pip and setuptools.
all = ["ampere[torch,jax,sbi,zeus,arviz,extinction]"]

[tool.setuptools]
include-package-data = false

# Automatic package discovery: future namespaces (ampere.core,
# ampere.backends, ...) are picked up without manual listing.
[tool.setuptools.packages.find]
include = ["ampere*"]

[tool.setuptools.package-data]
ampere = ["ampere_allfilters.hd5"]

[tool.setuptools_scm]

[tool.ruff]
# 100, not ruff's 88 default: wide enough that the pre-existing W0.4/W0.5
# characterisation suite (tests/characterisation/, frozen for this item --
# see WORK_ITEMS.md W0.6 "Constraints") passes lint/format-check without
# editing it, while still being a normal, deliberate line-length choice for
# new code.
line-length = 100
target-version = "py311"

# Lint/format scope policy (W0.6, 2026-09-01): the legacy codebase carries
# ~900 pre-existing ruff findings that are out of scope for this item and
# that AGENTS.md/WORK_ITEMS.md freeze anyway (`ampere/data`, `ampere/models`,
# `ampere/infer`; extended here to `ampere/utils`, `ampere/__init__.py`,
# `ampere/logger.py`, `ampere/examples`, `examples/` and `setup.py`, all of
# comparable vintage/quality) -- these are excluded outright rather than
# per-file-ignored, so the gate is meaningful. `docs` (Sphinx conf.py +
# demo notebooks under docs/source, and W0.7's harvested/archived branch
# snapshots under docs/design -- explicitly "does not import" per
# AGENTS.md) and the root `demo_pyphot.ipynb` are excluded for the same
# reason -- documentation/demo/archival material, not package or test
# source.
# `tests/` and the future new namespaces (`ampere/core`, `ampere/backends`,
# `ampere/inference`, `ampere/results`, per AGENTS.md ground rule 8) are
# NOT excluded -- they are linted/formatted strictly. The three remaining
# findings in `tests/characterisation/conftest.py` and the three in
# `tests/test_imports.py` are pre-existing and cannot be fixed here without
# editing frozen test logic; see `[tool.ruff.lint.per-file-ignores]` below.
extend-exclude = [
    "ampere/data",
    "ampere/models",
    "ampere/infer",
    "ampere/utils",
    "ampere/examples",
    "ampere/__init__.py",
    "ampere/logger.py",
    "examples",
    "docs",
    "demo_pyphot.ipynb",
    "setup.py",
]

# include notebooks!
include = ["*.py", "*.pyi", "**/pyproject.toml", "*.ipynb"]

[tool.ruff.lint]
select = ["A",  # prevent using keywords that clobber python builtins
          "B",  # bugbear: security warnings
          "E",  # pycodestyle
          "F",  # pyflakes
          "ISC",  # implicit string concatenation
          "UP",  # alert you when better syntax is available in your python version
          "RUF",  # the ruff developer's own rules
          "W",  # pycodestyle warnings

          ]
ignore = ["UP004", "B007"]  # ["E501", "W503"]

[tool.ruff.lint.per-file-ignores]
# tests/characterisation/ is frozen test logic for this item (W0.6
# Constraints) -- these three Bugbear findings pre-date this branch and
# cannot be fixed by editing the file, only ignored: B008 (np.array(...) in
# a default argument -- LinearModel mirrors the legacy example's
# ASimpleModel signature deliberately), B005 (ampere.__file__.strip(...)
# multi-char strip -- mirrors legacy filter-library loading idiom), B905
# (zip() without strict= in assert_means_within_tolerance).
"tests/characterisation/conftest.py" = ["B005", "B008", "B905"]
# Same freeze does not cover test_imports.py, but this item is config-only
# outside frozen paths too: three `# noqa: F401` comments (W0.5, on
# `import ampere.models` / `.infer` / `.data` inside
# test_top_level_packages_import_cleanly) are flagged RUF100
# (unused-noqa) because ruff's pyflakes only raises F401 once per
# repeatedly-rebound local name (`ampere`) across the four `import
# ampere[.x]` statements -- a ruff quirk, not a reason to touch W0.5's test.
"tests/test_imports.py" = ["RUF100"]

# ruff format is the formatter (replaces the historical black config,
# which was never wired into CI/pre-commit and had drifted -- py38/py39
# target versions predating the >=3.11 packaging floor set in W0.3).

# [tool.pytest]
# TBD

# ---------------------------------------------------------------------------
# pixi (W0.8): environment management wraps pyproject.toml rather than
# duplicating it. Python itself comes from conda-forge (pixi needs a conda
# interpreter); every other dependency -- [project.dependencies] and
# whichever [project.optional-dependencies] extras a feature below asks
# for -- comes from installing `ampere` itself as an editable PyPI
# dependency (the pixi equivalent of `pip install -e ".[...]"`), so
# pyproject.toml stays the single source of truth. No package version is
# pinned twice.
# ---------------------------------------------------------------------------

[tool.pixi.workspace]
channels = ["conda-forge"]
# Matches the project's sole OS classifier (`Operating System :: POSIX ::
# Linux`, [project.classifiers] above).
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
ampere = { path = ".", editable = true }

[tool.pixi.tasks]
# Fast tests: the import-quarantine suite (tests/test_imports.py) --
# everything else quick enough to belong here already lives there. The
# slow suite is test-characterisation, below.
test = "pytest tests/test_imports.py"
test-characterisation = "pytest tests/characterisation"
lint = "ruff check ."
format-check = "ruff format --check . --exclude tests/characterisation"
# pyrefly is scoped to the new namespaces (AGENTS.md ground rule 8); none
# of them exist yet, and a bare `pyrefly check ampere/core ampere/backends
# ampere/inference ampere/results` errors ("No Python files matched
# pattern ...") when a given directory is missing, so this must check
# which of the four exist and exit 0 cleanly when none do.
typecheck = "bash -c 'dirs=\"\"; for d in ampere/core ampere/backends ampere/inference ampere/results; do [ -d \"$d\" ] && dirs=\"$dirs $d\"; done; if [ -z \"$dirs\" ]; then echo \"typecheck: none of ampere/{core,backends,inference,results} exist yet -- nothing to check\"; else pyrefly check $dirs; fi'"
docs = "sphinx-build -b html docs/source docs/_build/html"

# --- One feature per Python interpreter, driving the CI matrix (W0.3
# packaging floor: requires-python >=3.11; CI targets 3.11-3.13) ---
[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

# --- One feature per [project.optional-dependencies] extra, mirrored 1:1
# via the editable install's `extras`, never duplicated here. ---
[tool.pixi.feature.dev.pypi-dependencies]
ampere = { path = ".", editable = true, extras = ["dev"] }

[tool.pixi.feature.zeus.pypi-dependencies]
ampere = { path = ".", editable = true, extras = ["zeus"] }

[tool.pixi.feature.sbi.pypi-dependencies]
ampere = { path = ".", editable = true, extras = ["sbi"] }

[tool.pixi.feature.extinction.pypi-dependencies]
ampere = { path = ".", editable = true, extras = ["extinction"] }

# Backend placeholders (Phase 2): [project.optional-dependencies] already
# stubs these (torch = ["torch"], jax = ["jax"]); wiring the pixi features
# up now means the eventual backend split doesn't also need a pixi change.
[tool.pixi.feature.torch.pypi-dependencies]
ampere = { path = ".", editable = true, extras = ["torch"] }

[tool.pixi.feature.jax.pypi-dependencies]
ampere = { path = ".", editable = true, extras = ["jax"] }

[tool.pixi.environments]
# Daily-use environment: latest supported Python plus the full non-sbi,
# non-backend toolchain (mirrors AGENTS.md's conda `ampere` env, which is
# Python 3.13).
dev = { features = ["py313", "dev", "zeus", "extinction"] }
# CI test matrix: one environment per Python version. Deliberately no
# `sbi` extra here -- torch is a large download and sbi tests skip cleanly
# by design (tests/characterisation/conftest.py's `requires_sbi` marker);
# see ci.yml and this item's report for the full rationale.
test-py311 = { features = ["py311", "dev", "zeus", "extinction"] }
test-py312 = { features = ["py312", "dev", "zeus", "extinction"] }
test-py313 = { features = ["py313", "dev", "zeus", "extinction"] }
# Full characterisation run including the sbi flow. sbi (extras =
# ["sbi"]) already depends on torch (pyproject.toml sbi = ["torch",
# "sbi<0.28"]), so torch is not listed separately here. Kept out of the
# default test-py3* matrix -- see ci.yml's non-blocking
# sbi-characterisation job.
sbi = { features = ["py313", "dev", "zeus", "extinction", "sbi"] }
# Standalone backend placeholder environments (Phase 2 not started; these
# just prove the torch/jax extras solve and stay installable until a real
# backend lands and needs them for something).
torch = { features = ["py313", "dev", "torch"] }
jax = { features = ["py313", "dev", "jax"] }

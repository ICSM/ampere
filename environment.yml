# Development environment for ampere.
#
# Creates a *new* env (deliberately not named `ampere`, so it cannot clash
# with an existing install). From the repository root:
#
#   conda env create -f environment.yml
#   conda activate ampere-dev
#
# The package itself, and the whole dev toolchain (pytest, ruff, pyrefly,
# coverage, docs tools), are installed via pip as an editable install with
# the `dev` extra.
name: ampere-dev
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - "-e .[dev]"

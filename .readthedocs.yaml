# Read the Docs configuration -- https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# This mirrors `pixi run docs` (pyproject.toml: `sphinx-build -W --keep-going`),
# which is also what CI's docs job runs, so the three builds agree. Read the
# Docs does not run pixi, so the build is declared here from pip and apt:
# the pip packages are the `docs` extra in pyproject.toml (sphinx, nbsphinx,
# nbconvert, ipykernel, zeus-mcmc -- the pixi `dev` environment installs the
# same extra), and the one non-pip tool, `pandoc` (nbsphinx shells out to it),
# comes from apt here and from conda in the pixi `dev` feature. `ipykernel` is
# in the extra because the two v2 notebooks under docs/source/notebooks are
# executed at build time (W6.1).
#
# Versions (W6.4): `latest` is built from the project's default branch (`v2`
# until the 1.0.0b1 tag, then `master`; set in the Read the Docs dashboard),
# and every tag is built automatically. `stable` is Read the Docs's own rule.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  apt_packages:
    - pandoc

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

sphinx:
  configuration: docs/source/conf.py
  # The same `-W` as `pixi run docs`: a warning fails the build here too.
  fail_on_warning: true

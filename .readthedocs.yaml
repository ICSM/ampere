# Read the Docs configuration -- https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# This mirrors `pixi run docs` (pyproject.toml: `sphinx-build -W --keep-going`),
# which is also what CI's docs job runs, so the three builds agree. Read the
# Docs does not run pixi, so the two non-pip tools the build needs are
# declared here directly: `pandoc` (nbsphinx shells out to it) from apt, and
# `ipykernel` (the two v2 notebooks under docs/source/notebooks are executed
# at build time since W6.1, so a registered kernel is needed) from pip. Until
# W6.4 lands a dedicated `docs` extra, the `dev` extra carries the Sphinx
# packages (sphinx, nbsphinx, nbconvert) and is installed here.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  apt_packages:
    - pandoc

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - dev
    - requirements: docs/requirements-readthedocs.txt

sphinx:
  configuration: docs/source/conf.py
  # The same `-W` as `pixi run docs`: a warning fails the build here too.
  fail_on_warning: true

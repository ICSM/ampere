name: CI

# W0.6/W0.8: the whole gate runs through pixi (prefix-dev/setup-pixi), so
# the environment setup is built once and shared with local development
# (`pixi run <task>`) rather than duplicated as ad-hoc pip/apt steps here.
# pyproject.toml's [tool.pixi.*] tables are the actual environment
# definitions; this file only decides which environment/task runs where.
#
# W2.11 states that as a rule rather than a habit: **every job below runs a
# named pixi task**, never an inline command line. If a step needs different
# arguments, the pixi task changes and local runs change with it; a flag that
# exists only in this file is a way for CI and a developer's machine to
# disagree, which is the failure mode this workflow is supposed to prevent.
# The one deliberate exception is `minimal-install`, whose entire point is to
# be the plainest possible pip install (see its own comment).
#
# W4.10: action references below are pinned to a full commit SHA with a
# `# vX.Y` comment (pinact style) rather than a floating tag, and
# `.github/dependabot.yml` enables the `github-actions` ecosystem so a
# version bump is a reviewable PR that updates both the SHA and its
# comment together, not a silent re-resolution of a tag.
#
# --- Path-filter table (W4.10 (2)) -----------------------------------------
# The `changes` job below computes these buckets from the PR's changed
# files (`.github/scripts/path_filters.py` is the executable source of
# truth; this table and docs/development.md's CI section are read-only
# copies of it, kept for humans who are not about to run the script):
#
#   ampere/inference/_blackjax.py,                      -> dev, jax
#   tests/inference/test_blackjax.py (W5.14; matched          (matched first,
#   before the CORE rule below; blackjax is a jax             ahead of CORE)
#   library and installs into the existing jax env,
#   so it rides that leg rather than one of its own)
#   ampere/inference/_nested.py,                        -> dev, nested
#   tests/inference/test_nested.py (W5.14; matched            (matched first,
#   before the CORE rule below)                               ahead of CORE)
#   pyproject.toml, pixi.lock, .github/**,              -> everything: dev,
#   ampere/core/**, ampere/results/**,                     torch, jax, sbi,
#   ampere/inference/**, and the shared test suites        nested, docs
#   (tests/{core,results,inference,conformance,m2,
#   interferometry,astrometry,benchmarks,scaling,gpu,
#   characterisation}/**; interferometry and astrometry
#   joined W5.26)
#   ampere/backends/torch/**,                           -> torch, sbi (sbi's
#   tests/backends/*torch*                                 env installs
#                                                           torch too)
#   ampere/backends/jax/**, tests/backends/*jax*        -> jax
#   ampere/backends/reference/**,                       -> dev only
#   tests/backends/** (remainder)
#   examples/sbi/**                                     -> dev, sbi
#   examples/interferometry/** (W4.4, not landed at     -> dev, torch, jax,
#   W4.10 -- MARKED SLOT, conservative until the study     sbi (conservative;
#   defines its own per-file backend split)                narrow when W4.4
#                                                           lands)
#   examples/** (remainder), tests/examples/**          -> dev only
#   docs/**, any *.md                                   -> dev, docs
#   anything else (unrecognised path)                   -> everything (same
#                                                           as the first row)
#
# A required check skipped by this filter still reports SUCCESS, never
# "skipped" or "expected": every job below always runs (no job-level `if:`
# keyed on the filter), and only its *steps* are conditioned on the
# relevant `needs.changes.outputs.*` flag -- see the `changes` job's own
# comment for why a top-level `on.push.paths`/`on.pull_request.paths` is
# deliberately not used instead. Push to master, `workflow_dispatch` and
# `schedule` runs are never gated -- only pull_request diffs narrow which
# steps do real work.
# -----------------------------------------------------------------------

on:
  push:
    # `v2` mirrors the local v2 master on the remote (2026-09-22) so the
    # workflow runs on it before the v2 line is merged to master.
    branches: [master, v2]
  pull_request:
  # Non-blocking triggers for the sbi-characterisation job only (see its
  # `if:` guard below) -- push/pull_request never run it. Before W3.7 the
  # reason was purely the size of the torch+sbi download; since W3.7 the
  # `backend-suites` matrix already pays that cost on every PR (its `sbi`
  # leg -- the "new-namespace suites (sbi, <group>)" checks, W5.26 -- is now
  # blocking), so the download
  # itself is no longer avoided here. What stays true, and is now the sole
  # reason, is that `sbi-characterisation` exercises the *legacy*
  # `ampere.infer.sbi` flow specifically (see that job's own comment) --
  # narrow, disjoint coverage that does not need every PR's turnaround time
  # added to it on top of the now-blocking `sbi` leg. Everything else in
  # this workflow also reruns on these two
  # events, which is harmless (same jobs as any push) rather than
  # something to specifically avoid.
  workflow_dispatch:
  schedule:
    # Weekly; 03:17 UTC Monday is an arbitrary off-peak time, chosen only
    # to avoid the top-of-hour scheduled-workflow crowd on GitHub's side.
    - cron: "17 3 * * 1"

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: path filters
    runs-on: ubuntu-latest
    # W4.10 (2), path gating. The honest pattern: compute the diff *inside*
    # the workflow (never `on.push.paths`/`on.pull_request.paths` at the
    # top of this file -- that would stop the whole workflow from
    # triggering at all on an unaffected PR, and a required check that
    # never gets a run sits as "Expected -- Waiting for status to be
    # reported" forever, hanging branch protection). Every job below always
    # runs; what a path-filter bucket controls is whether that job's
    # *steps* do real work or a one-line skip note, so every required-check
    # name always reports a conclusion, and an unaffected leg reports
    # SUCCESS, never "skipped" or "expected". See
    # `.github/scripts/path_filters.py`'s module docstring for the actual
    # rule table (also reproduced in docs/development.md's CI section) --
    # this job only calls it; the rules live in one file, not pasted into
    # both places and left to drift.
    #
    # Push to master, `workflow_dispatch` and `schedule` runs are never
    # gated (the script's fallback is "everything") -- path gating exists
    # to shorten a PR's feedback loop, not to under-test what actually
    # lands on master or what a human explicitly asked to run.
    outputs:
      run_dev: ${{ steps.filter.outputs.run_dev }}
      run_torch: ${{ steps.filter.outputs.run_torch }}
      run_jax: ${{ steps.filter.outputs.run_jax }}
      run_sbi: ${{ steps.filter.outputs.run_sbi }}
      run_nested: ${{ steps.filter.outputs.run_nested }}
      run_docs: ${{ steps.filter.outputs.run_docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: compute path filters
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python .github/scripts/path_filters.py \
            --event-name "$EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT"

  lint:
    name: lint + format-check
    runs-on: ubuntu-latest
    # Ungated: cheap (well under a minute) and applies to every Python file
    # regardless of which path-filter bucket it falls in, so there is no
    # saving from gating it -- see the `changes` job above for the buckets
    # that DO gate the slower jobs below.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          environments: dev
          cache: true
          # 2026-09-22: install from the lock as frozen. `--locked` (the action's
          # default) failed every job on the first `v2` run -- and fails locally on
          # pixi 0.68 and 0.81 alike -- with "'torch' requires index pypi.org but
          # the lock-file has download.pytorch.org": the satisfiability check
          # sees the plain `torch` requirement that pyro-ppl and sbi carry and does
          # not apply the per-package CPU index the manifest pins (W2.11), while
          # the solver does (a re-solve reproduces pixi.lock byte for byte). The
          # lock is current; the check is not.
          #
          # W5.26 (6), 2026-09-24: this is upstream prefix-dev/pixi#6834 ("Per-
          # package `index =` on a pypi-dependency makes the lock permanently
          # 'not up-to-date' when the name is also in `[project].dependencies`")
          # -- exactly this shape: the per-package `index` pin on `torch`
          # ([tool.pixi.feature.torch.pypi-dependencies] and the `sbi` feature's
          # own copy) plus `torch` also reaching the solve unindexed via
          # `pyro-ppl`/`sbi`'s plain `torch` requirement. Fixed upstream by
          # prefix-dev/pixi#7024 ("accept custom per-package index in
          # satisfiability for unindexed requirements"), merged to `main`
          # 2026-09-17 -- two days *after* pixi's latest tagged release,
          # v0.81.0 (2026-09-15); no release contains the fix as of this
          # comment. Reproduced locally with the fix absent: `pixi install -e
          # sbi --locked` still fails with the same message on 0.68.1. A
          # re-solve was NOT taken (it would only reproduce the current lock
          # byte for byte, per the paragraph above, and is not worth the
          # `pixi.lock` diff noise for no behaviour change) -- spelling the
          # extras out and a feature-level `extra-index-urls` were tried
          # before this item and do not help either (the latter breaks the
          # editable build). Nothing to do here but wait for a pixi release
          # that contains #7024 (or a later fix) and then flip `locked: true`,
          # `frozen: false` in one PR across every `setup-pixi` step below and
          # drop this comment; a genuinely stale lock still fails loudly under
          # `frozen: true` today (a missing dependency does not import), so
          # this is not a coverage gap in the meantime, only a missed early
          # warning for the one specific failure mode `--locked` alone would
          # add.
          locked: false
          frozen: true
      - run: pixi run -e dev lint
      - run: pixi run -e dev format-check

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    # W4.10 (3): actionlint joins the `dev` toolchain (conda-forge ships a
    # binary -- `pixi search actionlint` finds it -- so this is a pixi task
    # like every other check here, not a separate GitHub Action step; see
    # `pyproject.toml`'s [tool.pixi.tasks] `actionlint` entry). Ungated, same
    # reasoning as `lint` above: it validates every workflow file, and a
    # non-workflow PR benefits from it running for free (it costs a few
    # seconds). It is what makes the SHA-pinning below and in
    # `.github/dependabot.yml` earn their keep -- a workflow that stops
    # parsing, or a step that silently drops an input, is caught here
    # instead of on the next real PR.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          environments: dev
          cache: true
          # frozen, not locked: see the lint job's note (2026-09-22).
          locked: false
          frozen: true
      - run: pixi run -e dev actionlint

  typecheck:
    name: typecheck (pyrefly, new namespaces)
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: "skip note (path-gated: no `run_dev` paths changed)"
        if: needs.changes.outputs.run_dev != 'true'
        run: echo "skipped -- see the path-filter table in this workflow's header comment and .github/scripts/path_filters.py"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.run_dev == 'true'
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        if: needs.changes.outputs.run_dev == 'true'
        with:
          environments: dev
          cache: true
          # frozen, not locked: see the lint job's note (2026-09-22).
          locked: false
          frozen: true
      # W2.4/W2.5: this is the `dev` half of the typecheck, and `dev` has
      # neither backend extra -- so the task itself excludes
      # ampere/backends/torch and ampere/backends/jax here (they are piles of
      # unresolvable imports without their libraries, not piles of type
      # errors). Each is checked with its *real* types in the
      # backend-typecheck job below, which runs the same task in the
      # environment that has them.
      - run: pixi run -e dev typecheck
        if: needs.changes.outputs.run_dev == 'true'

  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        # Policy (Peter, 2026-09-03, W0.10): py3.11 stayed here while it was
        # free and could be dropped by deleting it from this list. It was
        # dropped on 2026-09-22 (Peter): the first run of this workflow on
        # the v2 branch showed arviz 1.x -- which ampere.results is written
        # against -- needs Python 3.12, so 3.11 silently resolved arviz 0.23
        # and failed tests/core; with a year of security fixes left it was
        # not worth a compatibility layer. The freed leg is 3.14.
        python: ["312", "313", "314"]
    # Path-gated on `run_dev` (this matrix is a `dev`-feature-set
    # environment per Python version -- no torch/jax extra -- so it is
    # unaffected by a torch- or jax-only change; see the `changes` job and
    # .github/scripts/path_filters.py). Every step below carries the same
    # `if:` rather than the job itself, so an unaffected PR still reports
    # "test (py312)" etc. as a green, completed check -- never skipped or
    # absent -- which is what keeps a required check honest for branch
    # protection.
    steps:
      - name: "skip note (path-gated: no `run_dev` paths changed)"
        if: needs.changes.outputs.run_dev != 'true'
        run: echo "skipped -- see the path-filter table in this workflow's header comment and .github/scripts/path_filters.py"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.run_dev == 'true'
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        if: needs.changes.outputs.run_dev == 'true'
        with:
          environments: test-py${{ matrix.python }}
          cache: true
          # frozen, not locked: see the lint job's note (2026-09-22).
          locked: false
          frozen: true
      - name: fast tests (with coverage)
        if: needs.changes.outputs.run_dev == 'true'
        run: pixi run -e test-py${{ matrix.python }} pytest tests/test_imports.py --cov=ampere --cov-report=xml --cov-report=term
      # Characterisation suite (W0.4/W0.5, "legacy still works"): runs here
      # in [dev,zeus,extinction] -- no `sbi` extra, so torch is never
      # pulled into the main matrix. The sbi flow's tests skip cleanly by
      # design (tests/characterisation/conftest.py's `requires_sbi`
      # marker checks for torch+sbi and calls pytest.mark.skipif) rather
      # than failing, so this job still exercises real emcee/dynesty/zeus
      # passes plus a clean-skip check on every PR. Kept in the same job
      # as the fast tests (not split out) because total time here is a
      # couple of minutes, well within budget -- see the sbi-
      # characterisation job below for the torch/sbi-inclusive run this
      # deliberately excludes.
      - name: characterisation suite (emcee/dynesty/zeus; sbi skips cleanly)
        if: needs.changes.outputs.run_dev == 'true'
        run: pixi run -e test-py${{ matrix.python }} test-characterisation
      # W0.10: tests/core and tests/conformance (which imports core) run on
      # every matrix leg, not just py3.13 -- the py3.11 core-import break
      # that survived until W1.10's review (fixed a8e6f54, see this item's
      # report) is exactly the failure mode a py3.13-only check would have
      # missed.
      #
      # W2.2: tests/results joins them. It used to be excluded here because
      # arviz was an extra that test-py311/312/313 deliberately left out to
      # avoid tripling the download; arviz and h5netcdf are base dependencies
      # now (results.md §15 R1's promotion landed with the engine drivers), so
      # every matrix leg has them anyway and the suite is free to run rather
      # than skip. tests/inference joins for the same reason -- it is where
      # emcee/dynesty/zeus are actually driven, and all three are present in
      # this environment.
      #
      # W2.11: tests/examples is deliberately NOT here. It is a ~16 s
      # end-to-end emcee run whose subject (examples/wstat_comparison.py) is
      # pure `ampere.core` + `ampere.inference` and has no version-dependent
      # surface of its own, so a second and third copy of it buys nothing that
      # tests/core and tests/inference do not already buy on these legs. It
      # runs once per environment in `suites` and `backend-suites` below,
      # where it also serves its other purpose (registry-leak containment in a
      # shared pytest process).
      - name: "phase 1 suite: core (py${{ matrix.python }})"
        if: needs.changes.outputs.run_dev == 'true'
        run: pixi run -e test-py${{ matrix.python }} test-core
      - name: "phase 1 suite: results (py${{ matrix.python }})"
        if: needs.changes.outputs.run_dev == 'true'
        run: pixi run -e test-py${{ matrix.python }} test-results
      - name: "phase 1 suite: conformance (py${{ matrix.python }})"
        if: needs.changes.outputs.run_dev == 'true'
        run: pixi run -e test-py${{ matrix.python }} conformance
      - name: "backends suite (py${{ matrix.python }})"
        if: needs.changes.outputs.run_dev == 'true'
        run: pixi run -e test-py${{ matrix.python }} test-backends
      - name: "inference suite (py${{ matrix.python }})"
        if: needs.changes.outputs.run_dev == 'true'
        run: pixi run -e test-py${{ matrix.python }} test-inference
      - name: upload coverage
        if: needs.changes.outputs.run_dev == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-py${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: ignore

  suites:
    name: new-namespace suites (dev, ${{ matrix.group }})
    runs-on: ubuntu-latest
    needs: changes
    # Path-gated on `run_dev` -- see the `changes` job and
    # .github/scripts/path_filters.py's rule table.
    #
    # W0.10: `ci.yml` never ran tests/core, tests/results or
    # tests/conformance before this job -- see that item's report for the
    # py3.11 core-import break (fixed a8e6f54) that only W1.10's manual
    # review caught. Runs on every PR, not on a schedule: locally this is
    # ~1500 tests in well under a minute in the `dev` environment, inside the
    # per-PR budget the `test` job's own characterisation step already sets.
    # Uses `dev` specifically (not one of the test-py3* environments) so
    # `arviz` and `netCDF4` are present and tests/results actually runs rather
    # than skipping everywhere -- a results suite that silently skipped on
    # every CI leg would satisfy the letter of this item and be worthless.
    #
    # W5.26: three matrix cells (`pyproject.toml`'s `test-group-core`,
    # `test-group-backends`, `test-group-studies`) instead of one `test-all`
    # step, so a red row in one group no longer hides every other group's
    # result behind it -- the problem this item was dispatched to fix (a red
    # `tests/m2` row on torch used to hide the whole forty-minute leg).
    # `test-all` itself (still a single pytest invocation across every
    # suite) is unchanged and remains the local gate; each group below is a
    # subset of it, not a separate command line, so a local run and a CI
    # cell always agree. Each group that carries a registry-leak proof keeps
    # its paired suite in one process -- see `test-group-core`'s and
    # `test-group-studies`'s comments in `pyproject.toml` for which two, and
    # `test-group-backends`'s for why the third (`tests/examples`) does not
    # need `tests/conformance` alongside it: its own conftest fixture
    # snapshots and restores the family registry around the one import
    # regardless of process, W0.10 finding (c) and W2.10/W2.11's additions
    # were what first proved the *other* two suites needed the pairing.
    strategy:
      fail-fast: false
      matrix:
        group: [core, backends, studies]
    steps:
      - name: "skip note (path-gated: no `run_dev` paths changed)"
        if: needs.changes.outputs.run_dev != 'true'
        run: echo "skipped -- see the path-filter table in this workflow's header comment and .github/scripts/path_filters.py"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.run_dev == 'true'
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        if: needs.changes.outputs.run_dev == 'true'
        with:
          environments: dev
          cache: true
          # frozen, not locked: see the lint job's note (2026-09-22).
          locked: false
          frozen: true
      - run: pixi run -e dev test-group-${{ matrix.group }}
        if: needs.changes.outputs.run_dev == 'true'
      # W2.11, DEVELOPMENT_PLAN.md §5 Phase 2: "benchmark suite ... with
      # results tracked as CI artefacts". The reference backend's row. Runs
      # once per environment, not once per group -- gated to the `core` cell
      # -- after the suites step, in the same job, so the environment is set
      # up once and the two never contend for the runner's memory (see
      # backend-suites' note on that).
      - run: pixi run -e dev bench
        if: needs.changes.outputs.run_dev == 'true' && matrix.group == 'core'
      - name: upload benchmark results
        # `always()` so a red suite still publishes whatever the benchmark
        # step managed -- but note the step above is skipped when the
        # `core` group's suites fail, so in practice this uploads nothing
        # then. It is here for the opposite case: a benchmark row that
        # fails still leaves its partial JSON attached to the PR, which is
        # when a reviewer most wants it. Still gated on `run_dev` and the
        # `core` cell (`&&`, not `always()` alone) so a skipped leg, or a
        # non-`core` cell that never runs `bench`, does not spend a step
        # trying to upload a file that was never produced. The artifact
        # name carries no group suffix because only the `core` cell
        # produces it -- one artifact per environment, as before.
        if: needs.changes.outputs.run_dev == 'true' && matrix.group == 'core' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmarks-dev
          path: benchmark.json
          if-no-files-found: ignore

  backend-typecheck:
    name: typecheck (pyrefly, ${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: changes
    # W4.10 (1), ruled by Peter on W3.7's report: `typecheck` split out of
    # each five-suite leg into its own matrix job, so the slow `sbi` leg's
    # critical path in `backend-suites` below is its `test-group-*` cells
    # alone -- this job and `backend-suites` are independent jobs (no
    # `needs:` between them), so they run concurrently rather than one
    # serialising in front
    # of the other inside a shared job. The trade-off is one extra
    # environment install per leg; `cache: true` (setup-pixi) is what keeps
    # that cheap.
    strategy:
      fail-fast: false
      matrix:
        environment: [torch, jax, sbi, nested]
    steps:
      - name: decide whether this leg's real work runs
        id: gate
        run: |
          case "${{ matrix.environment }}" in
            torch)  echo "run=${{ needs.changes.outputs.run_torch }}" >> "$GITHUB_OUTPUT" ;;
            jax)    echo "run=${{ needs.changes.outputs.run_jax }}" >> "$GITHUB_OUTPUT" ;;
            sbi)    echo "run=${{ needs.changes.outputs.run_sbi }}" >> "$GITHUB_OUTPUT" ;;
            nested) echo "run=${{ needs.changes.outputs.run_nested }}" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: "skip note (path-gated: no paths for this leg changed)"
        if: steps.gate.outputs.run != 'true'
        run: echo "skipped -- see the path-filter table in this workflow's header comment and .github/scripts/path_filters.py"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.gate.outputs.run == 'true'
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        if: steps.gate.outputs.run == 'true'
        with:
          environments: ${{ matrix.environment }}
          cache: true
          # frozen, not locked: see the lint job's note (2026-09-22).
          locked: false
          frozen: true
      # The environment's own types, with its real libraries present. The
      # `dev` typecheck job above cannot do this -- it excludes both backends
      # precisely because neither library is installed there -- so this step
      # is the only place ampere/backends/${{ matrix.environment }} is
      # actually type-checked (for `sbi`, that means `ampere/backends/torch`,
      # since jax is absent there too), and, for `sbi` specifically, the only
      # place `ampere/inference/_sbi.py` is checked with the real `sbi`
      # package installed rather than an untyped lazy import.
      - run: pixi run -e ${{ matrix.environment }} typecheck
        if: steps.gate.outputs.run == 'true'

  backend-suites:
    name: new-namespace suites (${{ matrix.environment }}, ${{ matrix.group }})
    runs-on: ubuntu-latest
    needs: changes
    # Path-gated per leg (`run_torch`/`run_jax`/`run_sbi`/`run_nested`) --
    # see the `changes` job and .github/scripts/path_filters.py's rule
    # table. The
    # `typecheck` step this job used to run first is now `backend-typecheck`
    # above, a separate job on the same matrix (W4.10 (1)): the two run
    # concurrently rather than one serialising in front of the other, so
    # this job's own critical path -- the slow `sbi` leg in particular -- is
    # `test-group-*` alone.
    #
    # W2.11, and DEVELOPMENT_PLAN.md §5's Phase 2 line ("separate torch, jax
    # and no-extras jobs"). W3.7 added `sbi` as this matrix's third leg,
    # promoting it from the non-blocking weekly `sbi-characterisation` job
    # below to a blocking PR gate -- the resulting check is named
    # "new-namespace suites (sbi, <group>)", exactly like its siblings,
    # which is what a branch-protection required-check entry must name. One
    # job per environment-and-group cell:
    #
    #  * `fail-fast: false` is load-bearing, not decoration. A broken torch
    #    row must fail the torch leg and leave the jax/sbi legs (and the
    #    other groups within torch) to report their own result; with
    #    fail-fast on (the default) GitHub cancels every sibling cell the
    #    moment one fails, and the answer to "did jax/sbi survive this
    #    change?" would be "cancelled". Together with `suites` above being a
    #    separate job on `dev`, this is what makes a failure in one
    #    environment-and-group cell a single-job failure: cells never share
    #    a runner, a step or a process.
    #  * Never two environments in one job -- and, since W5.26, never two
    #    groups in one job either, for the same isolation reason: a red
    #    `tests/m2` row on torch must not hide every other group's result in
    #    the same leg, which is the problem this split was dispatched to
    #    fix. `pixi run -e <env> test-all` is a five-suite, one-process
    #    gate; two of them running concurrently exhausted a 13 GB
    #    development machine during W4.10, and GitHub's hosted runners have
    #    7 GB -- a `test-group-*` cell is smaller again, so the matrix now
    #    runs more, smaller, more isolated jobs rather than fewer, larger
    #    ones. Sequential steps in one job would be safe on memory and wrong
    #    on isolation, which is the criterion that decides it.
    #  * `cache: true` matters most here: these are the largest environments
    #    (torch ~1.9 GB installed, jax ~0.5 GB, sbi -- torch's install plus
    #    the `sbi` extra (sbi, pyro-ppl) -- larger again). The torch and sbi
    #    installs would be several gigabytes larger still without
    #    pyproject.toml's CPU-index pin on `torch` -- see
    #    [tool.pixi.feature.torch.pypi-dependencies] and
    #    [tool.pixi.feature.sbi.pypi-dependencies]. Hosted runners are
    #    CPU-only; GPU tests are a later, nightly/manual item and add no rows
    #    here.
    #  * `sbi`'s suites are the slowest of the four locally (see
    #    docs/development.md's "Environment" section for the recorded
    #    reference leg times) -- the neural density/likelihood/ratio
    #    estimator training in `tests/inference/test_sbi.py` (the `backends`
    #    group) costs more wall time than another environment's conformance
    #    rows do, even at the tiny CI budgets W3.2 and W3.6 chose. `bench` is
    #    deliberately NOT run for `sbi` (see the step below): it would only
    #    re-exercise the same torch-backed benchmarks the `torch` leg
    #    already runs, at a cost this already-slower leg cannot spare for
    #    numbers that duplicate an existing row.
    strategy:
      fail-fast: false
      matrix:
        environment: [torch, jax, sbi, nested]
        group: [core, backends, studies]
    steps:
      - name: decide whether this leg's real work runs
        id: gate
        run: |
          case "${{ matrix.environment }}" in
            torch)  echo "run=${{ needs.changes.outputs.run_torch }}" >> "$GITHUB_OUTPUT" ;;
            jax)    echo "run=${{ needs.changes.outputs.run_jax }}" >> "$GITHUB_OUTPUT" ;;
            sbi)    echo "run=${{ needs.changes.outputs.run_sbi }}" >> "$GITHUB_OUTPUT" ;;
            nested) echo "run=${{ needs.changes.outputs.run_nested }}" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: "skip note (path-gated: no paths for this leg changed)"
        if: steps.gate.outputs.run != 'true'
        run: echo "skipped -- see the path-filter table in this workflow's header comment and .github/scripts/path_filters.py"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.gate.outputs.run == 'true'
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        if: steps.gate.outputs.run == 'true'
        with:
          environments: ${{ matrix.environment }}
          cache: true
          # frozen, not locked: see the lint job's note (2026-09-22).
          locked: false
          frozen: true
      - run: pixi run -e ${{ matrix.environment }} test-group-${{ matrix.group }}
        if: steps.gate.outputs.run == 'true'
      # W3.7: `sbi`'s environment already contains `torch`, so running
      # `tests/benchmarks/` there would benchmark the same backend code the
      # `torch` leg already covers -- a second copy of the same numbers, not
      # a new one -- so this step and the upload below are skipped for `sbi`.
      # W5.14 adds `nested` to the exclusion for the same reason at one
      # remove: that environment is `dev`'s package set plus nautilus and
      # ultranest, so its benchmark rows would be the `dev` leg's own,
      # re-run. W5.26 adds the `core`-group gate: `bench` runs once per
      # environment, not once per group (the artifact name below carries no
      # group suffix, for the same reason), so it is conditioned on the one
      # cell that always runs regardless of which groups a diff touched.
      - name: benchmarks (torch, jax only; sbi and nested would duplicate)
        if: >-
          steps.gate.outputs.run == 'true' && matrix.group == 'core'
          && matrix.environment != 'sbi' && matrix.environment != 'nested'
        run: pixi run -e ${{ matrix.environment }} bench
      - name: upload benchmark results
        if: >-
          steps.gate.outputs.run == 'true' && matrix.group == 'core'
          && matrix.environment != 'sbi' && matrix.environment != 'nested'
          && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmarks-${{ matrix.environment }}
          path: benchmark.json
          if-no-files-found: ignore

  docs:
    name: docs build
    runs-on: ubuntu-latest
    needs: changes
    # Path-gated on `run_docs` -- see the `changes` job and
    # .github/scripts/path_filters.py's rule table.
    #
    # W2.11. DEVELOPMENT_PLAN.md §5 asked for this at Phase 1 ("Sphinx docs
    # build check with warnings-as-errors") and it never landed, because
    # `pixi run docs` was red on master for four environment reasons that had
    # nothing to do with any change under review: no `pandoc` for nbsphinx, no
    # registered Jupyter kernel for the two legacy notebooks that carry no
    # stored outputs, an autodoc entry for a module (ampere.infer.ptemcee
    # search) that does not exist, and a pile of legacy-docstring warnings.
    # The first three are fixed at their source (pyproject.toml's dev feature
    # declares pandoc and ipykernel; docs/source/conf.py sets
    # nbsphinx_execute = 'never' and says why for each notebook; the dead
    # automodule entry is gone).
    #
    # The fourth is why this job runs **without** `-W`. The remaining
    # warnings are legacy docstrings in ampere/{data,models,infer} -- frozen
    # by AGENTS.md ground rule 1, and editing them to silence a warning would
    # be touching frozen code for a cosmetic reason. Warnings-as-errors is
    # therefore deferred until the Phase 6 docs rebuild retires those pages;
    # what this job asserts today is the stronger half of the original intent
    # anyway: the documentation *builds*, from a clean clone, in a declared
    # environment, on every PR.
    steps:
      - name: "skip note (path-gated: no `run_docs` paths changed)"
        if: needs.changes.outputs.run_docs != 'true'
        run: echo "skipped -- see the path-filter table in this workflow's header comment and .github/scripts/path_filters.py"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.run_docs == 'true'
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        if: needs.changes.outputs.run_docs == 'true'
        with:
          environments: dev
          cache: true
          # frozen, not locked: see the lint job's note (2026-09-22).
          locked: false
          frozen: true
      - run: pixi run -e dev docs
        if: needs.changes.outputs.run_docs == 'true'

  minimal-install:
    name: minimal install (no extras)
    runs-on: ubuntu-latest
    needs: changes
    # Path-gated on `run_dev` -- see the `changes` job and
    # .github/scripts/path_filters.py's rule table.
    #
    # Deliberately NOT pixi: this job's entire point is to catch lazy-
    # import regressions under the plainest possible install --
    # `pip install -e .` with none of the optional extras -- which is
    # exactly the environment W0.5's quarantine work targets. Using pixi
    # here would exercise the pypi-dependencies/editable-install path
    # instead of a bare pip install, defeating the point.
    #
    # W2.11: this is also the no-extras leg DEVELOPMENT_PLAN.md §5's Phase 2
    # line names -- "`import ampere` must never require torch or jax". It
    # already was one, and the value of saying so is that nobody later
    # "improves" it into a pixi job. The three import lines below are the
    # assertion: none of ampere.core, ampere.inference or ampere.results may
    # reach an array library that is not installed here.
    steps:
      - name: "skip note (path-gated: no `run_dev` paths changed)"
        if: needs.changes.outputs.run_dev != 'true'
        run: echo "skipped -- see the path-filter table in this workflow's header comment and .github/scripts/path_filters.py"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.run_dev == 'true'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: needs.changes.outputs.run_dev == 'true'
        with:
          python-version: "3.13"
      - run: pip install -e .
        if: needs.changes.outputs.run_dev == 'true'
      - run: python -c "import ampere"
        if: needs.changes.outputs.run_dev == 'true'
      - name: the new namespaces import without torch or jax
        if: needs.changes.outputs.run_dev == 'true'
        run: python -c "import ampere.core, ampere.inference, ampere.results"
      - name: torch and jax are genuinely absent, so the step above proves something
        if: needs.changes.outputs.run_dev == 'true'
        run: python -c "import importlib.util as u; assert u.find_spec('torch') is None and u.find_spec('jax') is None, 'this job must have neither backend library installed'"
      - run: pip install pytest
        if: needs.changes.outputs.run_dev == 'true'
      - run: pytest tests/test_imports.py
        if: needs.changes.outputs.run_dev == 'true'

  sbi-characterisation:
    name: characterisation suite (with sbi extra)
    runs-on: ubuntu-latest
    # Non-blocking, kept as it was before W3.7: this duplicates most of what
    # the `test` job's characterisation step already covers (emcee/dynesty/
    # zeus), adding only the legacy sbi flow. Run on a schedule and on demand
    # rather than on every push/PR. See W0.6's report for the full rationale.
    # (W2.11 pinned this environment's torch to the CPU index too, so the
    # weekly run no longer downloads ~2 GB of CUDA runtime to a CPU-only
    # hosted runner.)
    #
    # W3.7 note: this job is unchanged by, and independent of, the `sbi` leg
    # `backend-suites` now runs on every PR ("new-namespace suites
    # (sbi, <group>)" below) -- that leg runs `pixi run -e sbi
    # test-group-*` (the new-namespace suites, including the sbi engine's
    # own tests in `tests/inference`), not `test-characterisation` (the
    # legacy `ampere.infer.sbi` flow), so the two jobs cover disjoint code
    # and neither makes the other redundant. This one stays weekly/on-demand
    # because it is still a large download relative to what it alone would
    # justify on every PR.
    # Not path-gated (deliberately): scheduled/manual runs are outside the
    # PR path-filter entirely -- see the `changes` job's comment and
    # .github/scripts/path_filters.py's "non-pull_request events... fall
    # back to everything" note. This `if:` is its pre-existing
    # schedule/workflow_dispatch guard, unrelated to path gating.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          environments: sbi
          cache: true
          # frozen, not locked: see the lint job's note (2026-09-22).
          locked: false
          frozen: true
      - run: pixi run -e sbi test-characterisation
